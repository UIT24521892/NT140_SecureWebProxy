# NT140 Secure Web Gateway Lab (spec §2). Owner of the shared skeleton: TV1 (INF-2).
# Each track edits only its own service blocks (plan §2.1).
name: nt140-swg

x-common: &common
  environment:
    TZ: ${TZ:-Asia/Ho_Chi_Minh}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  restart: unless-stopped

networks:
  lan_staff:
    internal: true
    ipam: { config: [ { subnet: 10.10.0.0/24 } ] }
  lan_guest:
    internal: true
    ipam: { config: [ { subnet: 10.20.0.0/24 } ] }
  svc:
    internal: true
    ipam: { config: [ { subnet: 10.30.0.0/24 } ] }
  wan:
    ipam: { config: [ { subnet: 172.30.0.0/24 } ] }

volumes:
  squid-cache:
  squid-ssldb:
  clamav-db:
  clamd-sock:

services:
  # --- Track INF/POL (TV1) -------------------------------------------------
  squid:
    <<: *common
    build: docker/squid
    image: nt140/squid:dev
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      TLS_MODE: ${TLS_MODE:-selective}
      WORK_HOURS_MODE: ${WORK_HOURS_MODE:-real}
      ICAP_BYPASS: ${ICAP_BYPASS:-off}
      ICAP_ENABLED: ${ICAP_ENABLED:-1}
      GUEST_RATE_BYTES: ${GUEST_RATE_BYTES:-262144}
    networks:
      lan_staff: { ipv4_address: 10.10.0.10 }
      lan_guest: { ipv4_address: 10.20.0.10 }
      svc: { ipv4_address: 10.30.0.10 }
      wan: { ipv4_address: 172.30.0.10 }
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:3128:3128"
    volumes:
      - ./policy:/etc/squid/policy:ro
      - ./certs:/opt/certs:ro
      - ./logs/squid:/var/log/squid
      - squid-cache:/var/spool/squid
      - squid-ssldb:/var/lib/squid/ssl_db
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      testweb: { condition: service_healthy }
      icap: { condition: service_healthy }

  # --- Track TLS (TV2) -----------------------------------------------------
  client-staff:
    <<: *common
    build: docker/client
    image: nt140/client:dev
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PROXY_URL: http://10.10.0.10:3128
      MANAGED: "1"
    networks:
      lan_staff: { ipv4_address: 10.10.0.101 }
    volumes:
      - ./tests/probe:/opt/lab:ro
      - ./certs/lab-public-ca.crt:/opt/certs/lab-public-ca.crt:ro
      - ./certs/lab-proxy-ca.crt:/opt/certs/lab-proxy-ca.crt:ro
      - ./certs/pinned.sha256:/opt/certs/pinned.sha256:ro
      - ./captures:/captures

  client-guest:
    <<: *common
    build: docker/client
    image: nt140/client:dev
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PROXY_URL: http://10.20.0.10:3128
      MANAGED: "0"
    networks:
      lan_guest: { ipv4_address: 10.20.0.101 }
    volumes:
      - ./tests/probe:/opt/lab:ro
      - ./certs/lab-public-ca.crt:/opt/certs/lab-public-ca.crt:ro
      - ./certs/pinned.sha256:/opt/certs/pinned.sha256:ro
      - ./captures:/captures

  sniffer: # TLS-6
    profiles: [capture]
    image: nicolaka/netshoot:v0.13  # Verified 2026-11-07: amd64 + arm64.
    network_mode: service:squid
    volumes:
      - ./captures:/captures
    command: ["sleep", "infinity"]

  tcpecho: # TLS-8 (P2)
    profiles: [p2]
    image: alpine/socat:1.8.0.0  # [VERIFY] tag + arm64 before TLS-8
    networks:
      wan: { aliases: [tcpecho.lab.test] }
    command: ["TCP-LISTEN:443,fork,reuseaddr", "EXEC:cat"]

  # --- Track TLS (TV2): testweb (TLS-9) ------------------------------------
  testweb:
    <<: *common
    build: docker/testweb
    image: nt140/testweb:dev
    networks:
      wan:
        ipv4_address: 172.30.0.50
        aliases:
          - allowed.lab.test
          - social.lab.test
          - games.lab.test
          - stream.lab.test
          - gamble.lab.test
          - uitbank.lab.test
          - uitbank-secure-login.lab.test
          - uitbank-verify-account.lab.test
          - malware-cdn.lab.test
          - downloads.lab.test
          - cache.lab.test
          - pinned.lab.test
          - dns.lab.test
    volumes:
      - ./certs/testweb.crt:/opt/certs/testweb.crt:ro
      - ./certs/testweb.key:/opt/certs/testweb.key:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Track THR (TV3) -----------------------------------------------------
  icap: # THR-4, spec §7
    <<: *common
    build: docker/icap
    image: nt140/icap:dev
    networks:
      svc: { ipv4_address: 10.30.0.20 }
    volumes:
      # clamd's unix socket, shared by the clamav service (see clamd_mod.conf).
      - clamd-sock:/run/clamd-sock
    healthcheck:
      # c-icap-client exits 0 even on an ICAP error, so match the status line.
      test: ["CMD-SHELL", "c-icap-client -i 127.0.0.1 -p 1344 -s virus_scan 2>&1 | grep -q 'ICAP/1.0 200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      clamav: { condition: service_healthy }

  clamav: # THR-4, spec §7
    <<: *common
    image: clamav/clamav-debian:1.4  # spec §2.1: the Alpine image has no arm64
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # The image turns CLAMD_CONF_<Name> into clamd.conf lines. Lower peak RAM on reload.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    networks:
      svc: { ipv4_address: 10.30.0.21 }
      wan: { ipv4_address: 172.30.0.21 }
    volumes:
      - clamav-db:/var/lib/clamav
      # The image puts clamd's LocalSocket in /tmp; share it with icap (spec §7).
      - clamd-sock:/tmp
    healthcheck:
      # Script shipped in the image: sends PING to clamd on 3310 and expects PONG.
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      # The first start downloads the signature database (spec §7).
      start_period: 360s

  goaccess: # THR-7
    <<: *common
    profiles: [dashboard]
    image: allinurl/goaccess:1.9.3  # [VERIFY] tag + arm64 before THR-7
    networks:
      wan: { ipv4_address: 172.30.0.60 }
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:7890:7890"
    volumes:
      - ./logs/squid:/var/log/squid:ro

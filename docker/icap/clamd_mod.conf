# clamd engine for virus_scan (spec §7).
Module common clamd_mod.so
# Use clamd's unix socket from the shared `clamd-sock` volume: over the socket the
# module hands clamd an open file descriptor. Over TCP (ClamdHost/ClamdPort) it sends
# a file path instead, which clamd in another container cannot open (docs/verify-log.md).
clamd_mod.ClamdSocket /run/clamd-sock/clamd.sock

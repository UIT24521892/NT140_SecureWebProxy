# virus_scan service (spec §7). Directive names come from the packaged virus_scan.conf.
Service antivirus_module virus_scan.so

# Scan every file group known to c-icap.magic that the lab downloads.
virus_scan.ScanFileTypes TEXT DATA EXECUTABLE ARCHIVE DOCUMENT
# Never release part of an object before the scan has finished.
virus_scan.SendPercentData 0
virus_scan.Allow204Responces on
# Scan errors block the object instead of letting it through.
virus_scan.PassOnError off
# Larger objects are NOT scanned. Known limitation, shown by T5.5.
virus_scan.MaxObjectSize 10M
virus_scan.DefaultEngine clamd

Include clamd_mod.conf

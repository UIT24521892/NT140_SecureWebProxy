# testweb virtual hosts (spec §8). One server answers every *.lab.test alias and the IP literal.
server {
    listen 80 default_server;
    # Generated at start: TLS listener when certs/testweb.crt exists.
    include /etc/nginx/nt140/tls.conf;
    server_name _;

    # Cacheable payloads: any /cacheable/<anything>/<size>.bin maps to one fixed file (spec §5.8).
    location ~ ^/cacheable/(?:[^/]+/)*(1m|2m|10m)\.bin$ {
        default_type application/octet-stream;
        alias /srv/data/$1.bin;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /nocache/1m.bin {
        default_type application/octet-stream;
        alias /srv/data/1m-nocache.bin;
        add_header Cache-Control "no-store" always;
    }

    # Unique paths for repeatable 1 KB HTML MISS/HIT benchmark requests.
    location /bench/ {
        root /srv/data;
        default_type text/html;
        try_files /page-1k.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /upload {
        default_type text/html;
        return 200 '<!doctype html><html><body><h1>Upload ($host)</h1><form method="post" action="#"><input type="file" name="f"><button>Upload</button></form><!-- LAB-ORIGIN host=$host --></body></html>\n';
    }

    location = /dns-query {
        default_type application/dns-json;
        return 200 '{"Status":0,"Comment":"NT140 fake DoH resolver","Answer":[]}\n';
    }

    location = /login {
        default_type text/html;
        return 200 '<!doctype html><html lang="vi"><body><h1>UIT Bank — LAB ONLY</h1><p>Trang mo phong, khong nhap thong tin that.</p><form action="#" onsubmit="return false"><label>Tai khoan <input autocomplete="off" name="user"></label><label>Mat khau <input type="password" autocomplete="off" name="pass"></label><button>Demo</button></form><!-- LAB-ORIGIN host=$host --></body></html>\n';
    }

    location = /payload.bin {
        default_type application/octet-stream;
        alias /srv/data/payload.bin;
    }

    location /files/ {
        alias /srv/data/files/;
        types {
            application/pdf pdf;
            application/zip zip;
            application/x-msdownload exe;
            application/vnd.android.package-archive apk;
            text/plain txt;
        }
        default_type application/octet-stream;
    }

    location = /dl/a1b2c3 {
        default_type application/x-msdownload;
        alias /srv/data/files/setup.exe;
        add_header Content-Disposition 'attachment; filename="update.exe"';
    }

    location / {
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
        return 200 '<!doctype html><html><body><h1>OK $host</h1><p>NT140 testweb</p><!-- LAB-ORIGIN host=$host --></body></html>\n';
    }
}

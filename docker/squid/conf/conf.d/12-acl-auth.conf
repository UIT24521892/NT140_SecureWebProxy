# Basic auth and group ACLs (spec §4, §5.2). Files are generated by the entrypoint.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/auth/users.htpasswd
auth_param basic children 5
auth_param basic realm NT140 Secure Web Gateway
auth_param basic credentialsttl 1 hour

acl authenticated proxy_auth REQUIRED
acl grp_admin proxy_auth "/etc/squid/auth/group_admin.txt"
acl grp_staff proxy_auth "/etc/squid/auth/group_staff.txt"

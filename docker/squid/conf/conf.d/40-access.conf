# http_access (spec §5.4). POL-1 skeleton: guest LAN open, everyone else must authenticate.
# TODO(POL-3): replace with the full ordered rule set from spec §5.4.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
# 'dst' ACLs resolve the URL host. Skip them for dryrun so feed hosts are never looked up (spec §12.3).
http_access deny !dryrun to_localhost
http_access deny !dryrun to_linklocal
http_access allow net_guest
http_access deny !authenticated
http_access allow grp_admin
http_access allow grp_staff
http_access deny all

# Remaining ACLs of spec §5.2: IP literals, file types, paths, time, SslBump steps, marks.
# Owner: POL-2.

# Destination written as an IP literal. -n: never do a DNS lookup for this check.
acl dst_is_ip dstdom_regex -n ^[0-9]+(\.[0-9]+){3}$
acl dst_is_ip dstdom_regex -n ^\[?[0-9a-fA-F]*:[0-9a-fA-F:.]*\]?$

acl blocked_ext urlpath_regex -i \.(exe|msi|scr|bat|cmd|ps1|vbs|jar|apk|dmg)(\?.*)?$
acl blocked_mime rep_mime_type -i ^application/x-msdownload$
acl blocked_mime rep_mime_type -i ^application/x-msdos-program$
acl blocked_mime rep_mime_type -i ^application/x-dosexec$
acl blocked_mime rep_mime_type -i ^application/vnd\.android\.package-archive$
acl blocked_paths url_regex -i "/etc/squid/policy/lists/local/blocked_paths.txt"

# Defines `work_hours`. Written by scripts/set-worktime.sh (spec §5.5).
include /etc/squid/policy/generated/work_hours.conf

acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

# Every deny line ends with one of these: it records the reason in the log
# (%{policy}note) and is the ACL that deny_info attaches the block page to (spec §5.6).
acl mark_phishing annotate_transaction policy=phishing
acl mark_malware annotate_transaction policy=malware
acl mark_doh annotate_transaction policy=doh
acl mark_ip_literal annotate_transaction policy=ip-literal
acl mark_gambling annotate_transaction policy=gambling
acl mark_social annotate_transaction policy=social
acl mark_games annotate_transaction policy=games
acl mark_streaming annotate_transaction policy=streaming
acl mark_worktime annotate_transaction policy=worktime
acl mark_path annotate_transaction policy=path
acl mark_filetype annotate_transaction policy=filetype
acl mark_filetype_mime annotate_transaction policy=filetype-mime
acl mark_sni_threat annotate_transaction policy=sni-threat

# Admin requests are tagged at http_access time so that http_reply_access can
# recognise them without running proxy_auth again (spec §5.4).
acl mark_group_admin annotate_transaction policy=group-admin
acl is_admin_note note policy group-admin

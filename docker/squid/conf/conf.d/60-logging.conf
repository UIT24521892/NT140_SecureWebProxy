# Logging (spec §10.1). Owner: THR-3.
#
# access.log      : native `squid` format, read by GoAccess (§10.3).
# access_lab.log  : `lab` format, TAB-separated, 16 fields in the order of §10.1.
#                   Parsed by tests/lib/squidlog.py (FIELDS must match this order).
# No credentials are logged: %un is the user name only, and no request header
# other than X-Lab-Test-Id is written (§10.1, T11.3).

logformat lab %{%Y-%m-%dT%H:%M:%S}tl.%03tu	%tr	%>a	%un	%Ss	%>Hs	%<st	%rm	%ru	%ssl::>sni	%ssl::bump_mode	%{policy}note	%mt	%adapt::sum_trs	%{X-Lab-Test-Id}>h	%Sh

access_log daemon:/var/log/squid/access.log squid
access_log daemon:/var/log/squid/access_lab.log lab

cache_log /var/log/squid/cache.log
debug_options ALL,1
logfile_rotate 0

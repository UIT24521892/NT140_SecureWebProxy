# Base settings (spec §2, §15). http_port lives in 20-sslbump.conf (spec §6.1).
visible_hostname nt140-swg
cache_effective_user proxy
coredump_dir /var/spool/squid
# Docker exposes a huge fd limit; cap it so squid does not size tables for it.
max_filedescriptors 8192
# Fast stop for `docker compose down`.
shutdown_lifetime 3 seconds
httpd_suppress_version_string on

# Block pages (spec §5.6). Owner: POL-3.
# Built by errors/build-errors.sh: stock templates plus the ERR_LAB_* pages.
error_directory /usr/share/squid/errors/nt140

# deny_info attaches to the LAST ACL of the deny line, i.e. the mark_<reason> ACL.
deny_info ERR_LAB_PHISHING mark_phishing
deny_info ERR_LAB_MALWARE mark_malware
deny_info ERR_LAB_DOH mark_doh
deny_info ERR_LAB_IP_LITERAL mark_ip_literal
deny_info ERR_LAB_GAMBLING mark_gambling
deny_info ERR_LAB_SOCIAL mark_social
deny_info ERR_LAB_GAMES mark_games
deny_info ERR_LAB_STREAMING mark_streaming
deny_info ERR_LAB_WORKTIME mark_worktime
deny_info ERR_LAB_PATH mark_path
deny_info ERR_LAB_FILETYPE mark_filetype
deny_info ERR_LAB_FILETYPE_MIME mark_filetype_mime

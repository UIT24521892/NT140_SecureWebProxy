# Domain list ACLs (spec §5.1, §5.2). Owner: POL-2.
# local/ is committed seed data; feeds/ is generated by `make feeds` and may be empty
# (`make init` creates the files, squid aborts on a missing ACL file).
acl cat_social dstdomain "/etc/squid/policy/lists/local/social.txt"
acl cat_social dstdomain "/etc/squid/policy/lists/feeds/ut1_social_networks.txt"
acl cat_games dstdomain "/etc/squid/policy/lists/local/games.txt"
acl cat_games dstdomain "/etc/squid/policy/lists/feeds/ut1_games.txt"
acl cat_streaming dstdomain "/etc/squid/policy/lists/local/streaming.txt"
acl cat_gambling dstdomain "/etc/squid/policy/lists/local/gambling.txt"
acl cat_gambling dstdomain "/etc/squid/policy/lists/feeds/ut1_gambling.txt"

acl threat_phishing dstdomain "/etc/squid/policy/lists/local/phishing.txt"
acl threat_phishing dstdomain "/etc/squid/policy/lists/feeds/phishing.txt"
acl threat_phishing dstdomain "/etc/squid/policy/lists/feeds/ut1_phishing.txt"
acl threat_malware dstdomain "/etc/squid/policy/lists/local/malware.txt"
acl threat_malware dstdomain "/etc/squid/policy/lists/feeds/malware.txt"
acl threat_malware dstdomain "/etc/squid/policy/lists/feeds/ut1_malware.txt"
acl threat_ips dst "/etc/squid/policy/lists/feeds/threat_ips.txt"

# Same sources as threat_phishing + threat_malware, matched on the TLS SNI (spec §6.2).
acl threat_sni ssl::server_name "/etc/squid/policy/lists/local/phishing.txt"
acl threat_sni ssl::server_name "/etc/squid/policy/lists/feeds/phishing.txt"
acl threat_sni ssl::server_name "/etc/squid/policy/lists/feeds/ut1_phishing.txt"
acl threat_sni ssl::server_name "/etc/squid/policy/lists/local/malware.txt"
acl threat_sni ssl::server_name "/etc/squid/policy/lists/feeds/malware.txt"
acl threat_sni ssl::server_name "/etc/squid/policy/lists/feeds/ut1_malware.txt"
acl nobump_sni ssl::server_name "/etc/squid/policy/lists/local/nobump.txt"

acl doh_providers dstdomain "/etc/squid/policy/lists/local/doh.txt"

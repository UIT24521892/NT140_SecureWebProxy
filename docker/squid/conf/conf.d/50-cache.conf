# Cache (spec §5.8). Owner: POL-5.
cache_mem 256 MB
maximum_object_size_in_memory 8 MB
cache_dir ufs /var/spool/squid 2048 16 256
maximum_object_size 64 MB

# Ubuntu's default refresh_pattern set, unchanged: origin Cache-Control is respected.
# The (/cgi-bin/|\?) line keeps URLs with a query string out of the cache, which is
# why cache tests use a unique path instead of a query (spec §8).
refresh_pattern ^ftp:		1440	20%	10080
refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
refresh_pattern \/(Packages|Sources)(|\.bz2|\.gz|\.xz)$ 0 0% 0 refresh-ims
refresh_pattern \/Release(|\.gpg)$ 0 0% 0 refresh-ims
refresh_pattern \/InRelease$ 0 0% 0 refresh-ims
refresh_pattern \/(Translation-.*)(|\.bz2|\.gz|\.xz)$ 0 0% 0 refresh-ims
refresh_pattern .		0	20%	4320
